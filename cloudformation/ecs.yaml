AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon ECS resources for the course end project

Parameters:

  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id

  FrontendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  BackendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  FrontendBlueTargetGroupArn:
    Type: String

  FrontendGreenTargetGroupArn:
    Type: String

  FrontendListenerRuleArn:
    Type: String

  FrontendRepositoryUri:
    Type: String

  BackendRepositoryUri:
    Type: String

  ECSTaskExecutionRoleArn:
    Type: String

  ECSInfrastructureRoleArn:
    Type: String

  FrontendDesiredCount:
    Type: Number

  BackendDesiredCount:
    Type: Number

  FrontendCpu:
    Type: String

  FrontendMemory:
    Type: String

  BackendCpu:
    Type: String

  BackendMemory:
    Type: String

  FrontendBakeTimeMinutes:
    Type: Number

  LogRetentionDays:
    Type: Number

  FrontendPort:
    Type: Number

  BackendPort:
    Type: Number

  ProjectName:
    Type: String
    Description: Project name used for ECS resource naming

  Environment:
    Type: String
    Description: Environment name used for ECS resource naming

Resources:

  # ---------------- ECS Cluster ----------------

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-ECS-Cluster'
      ServiceConnectDefaults:
        Namespace: !Sub '${ProjectName}.local'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ECS-Cluster'
        - Key: Environment
          Value: !Ref Environment

  # ---------------- CloudWatch Logs ----------------

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-frontend'
      RetentionInDays: !Ref LogRetentionDays

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-backend'
      RetentionInDays: !Ref LogRetentionDays

  # ---------------- Backend Task Definition ----------------

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-backend'
      Cpu: !Ref BackendCpu
      Memory: !Ref BackendMemory
      NetworkMode: awsvpc

      RequiresCompatibilities:
        - FARGATE

      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn

      ContainerDefinitions:
        - Name: backend
          Image: !Sub '${BackendRepositoryUri}:latest'
          Essential: true

          PortMappings:
            - Name: backend
              ContainerPort: !Ref BackendPort
              Protocol: tcp
              AppProtocol: http

          Environment:
            - Name: NODE_ENV
              Value: production

            - Name: PORT
              Value: !Sub '${BackendPort}'

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  # ---------------- Backend Service ----------------

  BackendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-Backend-Service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref BackendTaskDefinition

      DesiredCount: !Ref BackendDesiredCount

      LaunchType: FARGATE
      PlatformVersion: LATEST

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetAId
            - !Ref PrivateSubnetBId
          SecurityGroups:
            - !Ref BackendSecurityGroupId

      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub '${ProjectName}.local'
        Services:
          - PortName: backend
            DiscoveryName: backend
            ClientAliases:
              - DnsName: backend
                Port: !Ref BackendPort

  # ---------------- Frontend Task Definition ----------------

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-frontend'
      Cpu: !Ref FrontendCpu
      Memory: !Ref FrontendMemory
      NetworkMode: awsvpc

      RequiresCompatibilities:
        - FARGATE

      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn

      ContainerDefinitions:
        - Name: frontend
          Image: !Sub '${FrontendRepositoryUri}:latest'
          Essential: true

          PortMappings:
            - Name: frontend
              ContainerPort: !Ref FrontendPort
              Protocol: tcp
              AppProtocol: http

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  # ---------------- Frontend Service ----------------

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn:
      - BackendService

    Properties:
      ServiceName: !Sub '${ProjectName}-Frontend-Service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref FrontendTaskDefinition

      DesiredCount: !Ref FrontendDesiredCount

      LaunchType: FARGATE
      PlatformVersion: LATEST

      DeploymentController:
        Type: ECS

      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        BakeTimeInMinutes: !Ref FrontendBakeTimeMinutes

      HealthCheckGracePeriodSeconds: 60

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetAId
            - !Ref PrivateSubnetBId
          SecurityGroups:
            - !Ref FrontendSecurityGroupId

      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: !Ref FrontendPort
          TargetGroupArn: !Ref FrontendBlueTargetGroupArn
          AdvancedConfiguration:
            AlternateTargetGroupArn: !Ref FrontendGreenTargetGroupArn
            ProductionListenerRule: !Ref FrontendListenerRuleArn
            RoleArn: !Ref ECSInfrastructureRoleArn

      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub '${ProjectName}.local'


Outputs:

  ECSClusterName:
    Value: !Ref ECSCluster

  FrontendServiceName:
    Value: !GetAtt FrontendService.Name

  BackendServiceName:
    Value: !GetAtt BackendService.Name