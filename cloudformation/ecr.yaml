AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon ECR repositories for the course end project

Parameters:

  ProjectName:
    Type: String
    Description: Project name used for ECR repository naming

  Environment:
    Type: String
    Description: Environment name used for ECR repository naming

  EmptyOnDelete:
    Type: String
    Description: If true, the ECR repositories will be emptied when the stack is deleted. If false, the stack deletion will fail if the repositories are not empty.

Resources:

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-frontend"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: !Ref EmptyOnDelete
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 3 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-Frontend-ECR"
        - Key: Environment
          Value: !Ref Environment

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: !Ref EmptyOnDelete
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 3 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-Backend-ECR"
        - Key: Environment
          Value: !Ref Environment

Outputs:

  FrontendRepositoryName:
    Description: Frontend ECR repository name
    Value: !Ref FrontendRepository

  FrontendRepositoryUri:
    Description: Frontend ECR repository URI
    Value: !GetAtt FrontendRepository.RepositoryUri

  FrontendRepositoryArn:
    Description: Frontend ECR repository ARN
    Value: !GetAtt FrontendRepository.Arn

  BackendRepositoryName:
    Description: Backend ECR repository name
    Value: !Ref BackendRepository

  BackendRepositoryUri:
    Description: Backend ECR repository URI
    Value: !GetAtt BackendRepository.RepositoryUri

  BackendRepositoryArn:
    Description: Backend ECR repository ARN
    Value: !GetAtt BackendRepository.Arn