AWSTemplateFormatVersion: '2010-09-09'
Description: Root CloudFormation stack for the course end project

Parameters:

  ProjectBucketName:
    Type: String
    Description: Shared S3 bucket for the course end project
  
  GitHubConnectionArn:
    Type: String
    Description: Existing AWS CodeConnections ARN for GitHub
    
  
Resources:

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./network.yaml
      TimeoutInMinutes: 20
      Tags:
        - Key: Name
          Value: CEP-Network-Nested-Stack
        - Key: Environment
          Value: Course-End-Project

  ECRStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./ecr.yaml
      TimeoutInMinutes: 10
      Tags:
        - Key: Name
          Value: CEP-ECR-Nested-Stack
        - Key: Environment
          Value: Course-End-Project

  IAMStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECRStack
    Properties:
      TemplateURL: ./iam.yaml
      TimeoutInMinutes: 10
      Parameters:
        ProjectBucketName: !Ref ProjectBucketName
        FrontendRepositoryArn: !GetAtt ECRStack.Outputs.FrontendRepositoryArn
        BackendRepositoryArn: !GetAtt ECRStack.Outputs.BackendRepositoryArn
      Tags:
        - Key: Name
          Value: CEP-IAM-Nested-Stack
        - Key: Environment
          Value: Course-End-Project

  ECSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - ECRStack
      - IAMStack
    Properties:
      TemplateURL: ./ecs.yaml
      Parameters:
        PrivateSubnetAId: !GetAtt NetworkStack.Outputs.PrivateSubnetAId
        PrivateSubnetBId: !GetAtt NetworkStack.Outputs.PrivateSubnetBId
        FrontendSecurityGroupId: !GetAtt NetworkStack.Outputs.FrontendSecurityGroupId
        BackendSecurityGroupId: !GetAtt NetworkStack.Outputs.BackendSecurityGroupId
        FrontendTargetGroupArn: !GetAtt NetworkStack.Outputs.FrontendTargetGroupArn
        FrontendRepositoryUri: !GetAtt ECRStack.Outputs.FrontendRepositoryUri
        BackendRepositoryUri: !GetAtt ECRStack.Outputs.BackendRepositoryUri
        ECSTaskExecutionRoleArn: !GetAtt IAMStack.Outputs.ECSTaskExecutionRoleArn

  CodeBuildStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECRStack
      - IAMStack
    Properties:
      TemplateURL: ./codebuild.yaml
      Parameters:
        CodeBuildRoleArn: !GetAtt IAMStack.Outputs.CodeBuildRoleArn
        FrontendRepositoryUri: !GetAtt ECRStack.Outputs.FrontendRepositoryUri
        BackendRepositoryUri: !GetAtt ECRStack.Outputs.BackendRepositoryUri

  CodePipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - IAMStack
      - CodeBuildStack
      - ECSStack
    Properties:
      TemplateURL: ./codepipeline.yaml
      Parameters:
        ProjectBucketName: !Ref ProjectBucketName
        CodePipelineRoleArn: !GetAtt IAMStack.Outputs.CodePipelineRoleArn
        CodeBuildProjectName: !GetAtt CodeBuildStack.Outputs.CodeBuildProjectName
        ECSClusterName: !GetAtt ECSStack.Outputs.ECSClusterName
        FrontendServiceName: !GetAtt ECSStack.Outputs.FrontendServiceName
        BackendServiceName: !GetAtt ECSStack.Outputs.BackendServiceName
        GitHubConnectionArn: !Ref GitHubConnectionArn
        GitHubOwner: void269
        GitHubRepository: Cloud-Computing-and-DevOps-Certification-Program
        GitHubBranch: main
  
Outputs:

  NetworkStackId:
    Description: Nested network stack ID
    Value: !Ref NetworkStack

  ECRStackId:
    Description: Nested ECR stack ID
    Value: !Ref ECRStack

  ALBDNSName:
    Description: Public DNS name returned by the network stack
    Value: !GetAtt NetworkStack.Outputs.ALBDNSName

  FrontendRepositoryUri:
    Description: Frontend ECR repository URI
    Value: !GetAtt ECRStack.Outputs.FrontendRepositoryUri

  BackendRepositoryUri:
    Description: Backend ECR repository URI
    Value: !GetAtt ECRStack.Outputs.BackendRepositoryUri